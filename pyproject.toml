[project]
name = "ehentaiautosignin"
version = "0.1.0"
description = "Auto Sign In for E-Hentai"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "requests[socks]>=2.32.4",
    "schedule>=1.2.2",
    "urllib3>=2.5.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ehentai"]
py-modules = ["main", "notify"]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
]
